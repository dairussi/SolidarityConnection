name: CI/CD - SolidarityConnection to EKS

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: solidarity-connection-eks
  NAMESPACE: solidarity-connection-namespace
  MIGRATION_TIMEOUT_SECONDS: 300
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./SolidarityConnection.sln

      - name: Build
        run: dotnet build ./SolidarityConnection.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ./SolidarityConnection.sln --configuration Release --no-build --verbosity normal

  containerize-and-push:
    name: Containerize, Scan & Push
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./SolidarityConnection.Presentation/Dockerfile
          target: runtime
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:latest
            ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:${{ env.IMAGE_TAG }}
          load: true

      - name: Security scan - API image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./SolidarityConnection.Presentation/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:latest
            ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:${{ env.IMAGE_TAG }}

      - name: Build Migrations image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./SolidarityConnection.Presentation/Dockerfile
          target: migrations
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:migrations
            ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:migrations-${{ env.IMAGE_TAG }}
          load: true

      - name: Security scan - Migrations image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:migrations-${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Migrations image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./SolidarityConnection.Presentation/Dockerfile
          target: migrations
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:migrations
            ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:migrations-${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: containerize-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.32.0'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply namespace and configmap
        run: |
          kubectl apply -f namespace.yaml
          kubectl apply -f configmap.yaml

      - name: Create or update Kubernetes Secret
        run: |
          kubectl create secret generic solidarity-connection-api-secret \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=ConnectionStrings__DefaultConnection="${{ secrets.SOLIDARITY_CONNECTION_DB_CONNECTION_STRING }}" \
            --from-literal=Jwt__SecretKey="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=AdminSeed__Password="${{ secrets.ADMIN_SEED_PASSWORD }}" \
            --from-literal=RabbitMQ__Host="${{ secrets.RABBITMQ_HOST }}" \
            --from-literal=RabbitMQ__Port="${{ secrets.RABBITMQ_PORT }}" \
            --from-literal=RabbitMQ__Username="${{ secrets.RABBITMQ_USERNAME }}" \
            --from-literal=RabbitMQ__Password="${{ secrets.RABBITMQ_PASSWORD }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Delete old migration job if exists
        run: |
          kubectl delete job solidarity-connection-api-migration \
            -n ${{ env.NAMESPACE }} \
            --ignore-not-found=true

      - name: Run database migration
        run: |
          set -euo pipefail

          dump_migration_diagnostics() {
            echo "========== MIGRATION JOB =========="
            kubectl describe job solidarity-connection-api-migration -n ${{ env.NAMESPACE }} || true

            echo "========== MIGRATION PODS =========="
            kubectl get pods -n ${{ env.NAMESPACE }} -l job-name=solidarity-connection-api-migration -o wide || true

            for pod in $(kubectl get pods -n ${{ env.NAMESPACE }} -l job-name=solidarity-connection-api-migration -o name 2>/dev/null); do
              echo "========== LOGS ${pod} =========="
              kubectl logs -n ${{ env.NAMESPACE }} "${pod}" --all-containers=true --tail=-1 || true

              echo "========== DESCRIBE ${pod} =========="
              kubectl describe -n ${{ env.NAMESPACE }} "${pod}" || true
            done
          }

          sed -i "s|image:.*solidarity-connection-api-image:migrations.*|image: ${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:migrations-${{ env.IMAGE_TAG }}|" \
            migration-job.yaml

          kubectl apply -f migration-job.yaml

          deadline=$((SECONDS + ${{ env.MIGRATION_TIMEOUT_SECONDS }}))

          while [ "$SECONDS" -lt "$deadline" ]; do
            succeeded="$(kubectl get job solidarity-connection-api-migration -n ${{ env.NAMESPACE }} -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)"
            failed="$(kubectl get job solidarity-connection-api-migration -n ${{ env.NAMESPACE }} -o jsonpath='{.status.failed}' 2>/dev/null || echo 0)"
            active="$(kubectl get job solidarity-connection-api-migration -n ${{ env.NAMESPACE }} -o jsonpath='{.status.active}' 2>/dev/null || echo 0)"

            if [ "${succeeded:-0}" = "1" ]; then
              echo "Migration concluida com sucesso."
              exit 0
            fi

            if [ "${failed:-0}" != "0" ] && [ "${active:-0}" = "0" ]; then
              echo "Migration job falhou."
              dump_migration_diagnostics
              exit 1
            fi

            echo "Aguardando migration... active=${active:-0} failed=${failed:-0} succeeded=${succeeded:-0}"
            sleep 10
          done

          echo "Migration job nao concluiu dentro de ${{ env.MIGRATION_TIMEOUT_SECONDS }}s."
          dump_migration_diagnostics
          exit 1

      - name: Deploy application (Rolling Update)
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml

          kubectl set image deployment/solidarity-connection-api \
            solidarity-connection-api=${{ secrets.DOCKER_USERNAME }}/solidarity-connection-api-image:${{ env.IMAGE_TAG }} \
            -n ${{ env.NAMESPACE }}

          kubectl rollout status deployment/solidarity-connection-api \
            -n ${{ env.NAMESPACE }} \
            --timeout=180s

      - name: Show deployment status
        if: always()
        run: |
          echo "========== PODS =========="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide || true
          echo "========== JOBS =========="
          kubectl get jobs -n ${{ env.NAMESPACE }} || true
          echo "========== SERVICES =========="
          kubectl get svc -n ${{ env.NAMESPACE }} || true
          echo "========== IMAGEM DEPLOYADA =========="
          if kubectl get deployment solidarity-connection-api -n ${{ env.NAMESPACE }} >/dev/null 2>&1; then
            kubectl get deployment solidarity-connection-api -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.spec.template.spec.containers[0].image}'
          else
            echo "Deployment solidarity-connection-api ainda nao existe no namespace."
          fi
          echo ""
          echo "========== EVENTOS =========="
          kubectl get events -n ${{ env.NAMESPACE }} --sort-by='.lastTimestamp' | tail -20 || true
