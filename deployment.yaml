apiVersion: apps/v1
kind: Deployment
metadata:
  name: solidarity-connection-api
  namespace: solidarity-connection-namespace
  labels:
    app: solidarity-connection-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solidarity-connection-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: solidarity-connection-api
    spec:
      containers:
        - name: solidarity-connection-api
          image: daiana2026dev/solidarity-connection-api-image:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: solidarity-connection-api-config
            - secretRef:
                name: solidarity-connection-api-secret
            - secretRef:
                name: mongodb-secret
                optional: true
          env:
            - name: RabbitMQ__Host
              value: "solidarity-connection-rabbitmq"
            - name: RabbitMQ__Port
              value: "5672"
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
